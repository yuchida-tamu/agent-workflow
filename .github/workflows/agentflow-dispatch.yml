name: agentflow · dispatch
on:
  issues:
    types: [labeled]
permissions:
  issues: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yuchida-tamu/agent-workflow/actions/dispatch@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
