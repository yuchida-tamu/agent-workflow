# Optional: create the agentflow GitHub App and set AGENTFLOW_APP_ID and
# AGENTFLOW_APP_PRIVATE_KEY as repo secrets, and every agentflow action below
# acts as the App rather than as this workflow. Unset secrets evaluate to empty
# strings, so leaving them unset changes nothing. See docs/github-app-runbook.md.
name: agentflow · dispatch
on:
  issues:
    types: [labeled]
permissions:
  issues: write
  contents: read
# One dispatch in flight per issue, so a label applied twice cannot race two
# launches for the same work item.
concurrency:
  group: agentflow-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yuchida-tamu/agent-workflow/actions/dispatch@v0.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          app-id: ${{ secrets.AGENTFLOW_APP_ID }}
          app-private-key: ${{ secrets.AGENTFLOW_APP_PRIVATE_KEY }}
