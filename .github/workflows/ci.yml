name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Policy packs validate and pass fixtures
        run: node scripts/policy/cli.js test policies/baseline.yaml packs/expo/policies/expo.yaml
