name: agentflow · risk verdict
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: read
jobs:
  verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: __TOOLKIT_REPO__/actions/risk-verdict@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
