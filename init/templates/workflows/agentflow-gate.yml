name: agentflow · gate
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
  contents: read
jobs:
  gate:
    # issue comments only (PR merge gate is native review + branch protection)
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: __TOOLKIT_REPO__/actions/gate-check@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
