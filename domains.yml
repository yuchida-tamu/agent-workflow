# The toolkit's own domain map — the loop manages this repo too.
policy-engine:
  description: "Risk evaluation: the engine, baseline pack, and pack grammar"
  criticality: critical
  paths: ["scripts/policy/**", "policies/**"]

state-and-gates:
  description: "State machine, transitions, gate approval validation"
  criticality: critical
  paths: ["scripts/state/**", "scripts/gate/**"]

# `critical` for the pair of reasons that earn it: this code decides whether a
# gate approval stands, and it mints the credentials agents act with. Left
# unmapped it would fall to `unmapped_criticality: medium` — credential handling
# behind a default is exactly the gap that hid scripts/release/**.
identity:
  description: "Who is acting: the agent's GitHub App identity, its tokens, and what a bot may approve"
  criticality: critical
  paths: ["scripts/identity/**"]

actions-wiring:
  description: "Event handlers and composite actions consuming apps depend on"
  criticality: high
  paths: ["scripts/actions/**", "actions/**", "init/templates/workflows/**", ".github/workflows/**"]

release:
  description: "G4: what shipping means — tag, GitHub release, the released state"
  criticality: high
  paths: ["scripts/release/**"]

verdict-reader:
  description: "Reading risk verdicts back out of the record to authorise a gate"
  criticality: high
  paths: ["scripts/verdict/**"]

review-reader:
  description: "Reading the G3 review artifact (native review or marker comment) back out of the record to authorise the gate"
  criticality: high
  paths: ["scripts/review/**"]

dispatch:
  description: "Who acts next: the crawl-phase dispatcher and its dispatch table"
  criticality: medium
  paths: ["scripts/next/**"]

hierarchy:
  description: "Parent↔child resolution over sub-issues, with the text fallback"
  criticality: medium
  paths: ["scripts/hierarchy/**"]

approval-inbox:
  description: "The interactive gate inbox — human instrument, agents denied"
  criticality: medium
  paths: ["scripts/gates/**"]

config:
  description: "Reading agentflow.config.json and resolving what it implies"
  criticality: medium
  paths: ["scripts/config/**"]

e2e-runner:
  description: "Gherkin parsing, trace replay, runner semantics"
  criticality: high
  paths: ["scripts/e2e/**", "scenarios/**"]

run-ledger:
  description: "Per-iteration agent/model/phase audit log"
  criticality: medium
  paths: ["scripts/log/**"]

facts:
  description: "Diff/domain/drift fact extraction feeding the policy engine"
  criticality: high
  paths: ["scripts/facts/**"]

installer:
  description: "agentflow-init, labels, templates"
  criticality: medium
  paths: ["init/**"]

agent-roster:
  description: "Agent definitions (source of truth in agents/, installed copies in .claude/)"
  criticality: medium
  paths: ["agents/**", ".claude/agents/**"]

platform-packs:
  description: "Platform pack contents (expo)"
  criticality: medium
  paths: ["packs/**"]

docs:
  description: "Architecture doc, README, specs"
  criticality: low
  paths: ["*.md", "*.html", "interfaces/**"]

# Given an explicit answer rather than left unmapped by accident. `low` because
# `low-surface-change` already softens test-only diffs, and because leaving 17
# files unclassified inflated `unmapped_fraction` enough to hide real gaps
# behind noise — which is how scripts/release/** stayed invisible.
tests:
  description: "The suite that validates everything above"
  criticality: low
  paths: ["test/**"]

# Config and package metadata. `medium` rather than `low`: agentflow.config.json
# decides release semantics and who may approve, and package.json carries the
# bin entries every command is reached through.
project-config:
  description: "Repo-level config and package metadata"
  criticality: medium
  paths: ["agentflow.config.json", "package.json", "package-lock.json", "domains.yml"]
