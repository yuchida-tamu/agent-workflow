name: agentflow headless review
description: >-
  Run the repo's own code-reviewer against a pull request with no interactive
  session, and post its findings. Billed to a Claude subscription via
  CLAUDE_CODE_OAUTH_TOKEN — never to a metered API key.
inputs:
  github-token:
    description: Fallback token, used when no App credentials are supplied. Token with pull-requests write access
    required: true
  claude-oauth-token:
    description: >-
      Subscription token from `claude setup-token`, passed from the
      CLAUDE_CODE_OAUTH_TOKEN secret. Optional: leave it unset and the action
      reports "headless disabled" and exits green, having done nothing. This is
      deliberately NOT an API key — there is no metered fallback.
    required: false
    default: ""
  app-id:
    description: >-
      agentflow GitHub App id. Set it together with app-private-key and this
      action acts as the App instead of as the workflow. Optional everywhere:
      leave both unset and behaviour is exactly what it was.
    required: false
    default: ""
  app-private-key:
    description: >-
      The App's private key (PEM). Pass it from a secret — never commit it.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint an agentflow App token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
    - name: Name the acting identity
      # Two independent credentials, and the log says where each stands. A
      # fallback that silently impersonates the human is the failure #82 exists
      # to remove; a run that silently bills a metered key is the one #83 exists
      # to remove. Both conditions are computed from the *inputs*, never from a
      # token, so nothing secret reaches the script.
      shell: bash
      env:
        ACTING_AS_APP: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
        APP_ID: ${{ inputs.app-id }}
        HAS_SUBSCRIPTION_TOKEN: ${{ inputs.claude-oauth-token != '' }}
      run: |
        if [ "$ACTING_AS_APP" = "true" ]; then
          echo "identity: acting as the agentflow App (app-id $APP_ID)"
        else
          echo "identity: acting as GITHUB_TOKEN — no App credentials supplied."
          echo "          The review will be attributed to the workflow, not to agentflow."
          echo "          See docs/github-app-runbook.md."
        fi
        if [ "$HAS_SUBSCRIPTION_TOKEN" = "true" ]; then
          echo "billing:  subscription (CLAUDE_CODE_OAUTH_TOKEN). No API-metered spend."
        else
          echo "billing:  no subscription token supplied — headless review is disabled."
          echo "          ANTHROPIC_API_KEY is deliberately not a fallback: see docs/headless-runbook.md."
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install toolkit deps
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/../.." && npm ci --omit=dev
    - name: Install Claude Code
      # Pinned to the major line rather than floating: the argv this action emits
      # is checked by hand against the CLI's documented flags, and a silent
      # upgrade can retire one (see KNOWN_FLAGS in scripts/headless/core.js).
      shell: bash
      if: ${{ inputs.claude-oauth-token != '' }}
      run: npm install -g @anthropic-ai/claude-code@2
    - name: Review
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.github-token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/actions/headless-review.js"
