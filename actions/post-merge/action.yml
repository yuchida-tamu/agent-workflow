name: agentflow post-merge
description: After a PR merges, run the post-merge smoke step and transition the linked issue merged → verified. A repo with no scenario suite passes vacuously.
inputs:
  github-token:
    description: Token with issues write access
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install toolkit deps
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/../.." && npm ci --omit=dev
    - name: Post-merge smoke
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/actions/post-merge.js"
