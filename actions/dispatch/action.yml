name: agentflow dispatch
description: >-
  On a state label change, post who acts next on the issue — or launch that agent
  headlessly when `headless.dispatch.<state>` is on. Every flag ships off, so the
  default is the comment this action has always posted.
inputs:
  github-token:
    description: Fallback token, used when no App credentials are supplied. Token with issues write access
    required: true
  claude-oauth-token:
    description: >-
      Subscription token from `claude setup-token`. Only used when a
      `headless.dispatch.<state>` flag is on for the state being dispatched.
      Optional: without it the action posts the dispatch comment exactly as it
      always has. There is deliberately no metered-API-key fallback.
    required: false
    default: ""
  app-id:
    description: >-
      agentflow GitHub App id. Set it together with app-private-key and this
      action acts as the App instead of as the workflow. Optional everywhere:
      leave both unset and behaviour is exactly what it was.
    required: false
    default: ""
  app-private-key:
    description: >-
      The App's private key (PEM). Pass it from a secret — never commit it.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint an agentflow App token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
    - name: Name the acting identity
      # A fallback that silently impersonates the human is the failure #82 exists
      # to remove, so the run log always says who is acting. The condition is
      # computed from the *inputs*, never from the token, so nothing secret
      # reaches the script.
      shell: bash
      env:
        ACTING_AS_APP: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        if [ "$ACTING_AS_APP" = "true" ]; then
          echo "identity: acting as the agentflow App (app-id $APP_ID)"
        else
          echo "identity: acting as GITHUB_TOKEN — no App credentials supplied."
          echo "          Work will be attributed to the workflow, not to agentflow."
          echo "          See docs/github-app-runbook.md to give agentflow its own identity."
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install toolkit deps
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/../.." && npm ci --omit=dev
    - name: Install Claude Code
      # Only when a subscription token is supplied. A repo that never enables a
      # dispatch flag pays nothing for this step.
      shell: bash
      if: ${{ inputs.claude-oauth-token != '' }}
      run: npm install -g @anthropic-ai/claude-code@2
    - name: Dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.github-token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/actions/dispatch-comment.js"
