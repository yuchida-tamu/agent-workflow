name: agentflow dispatch
description: On a state label change, post who acts next on the issue (crawl-phase visibility; replaced by headless agent launch in Phase 3).
inputs:
  github-token:
    description: Token with issues write access
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install toolkit deps
      shell: bash
      run: cd "$GITHUB_ACTION_PATH/../.." && npm ci --omit=dev
    - name: Dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/actions/dispatch-comment.js"
